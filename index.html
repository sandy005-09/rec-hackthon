<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Financial Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h2 class="text-2xl font-bold mb-4 text-blue-600">💰 Financial Assistant</h2>

        <div id="chat-box" class="h-64 overflow-y-scroll border p-4 mb-4 rounded bg-gray-50 flex flex-col gap-2"></div>

        <div class="flex gap-2">
            <input type="text" id="user-input" class="border p-2 flex-grow rounded" placeholder="Ask financial question...">
            <button onclick="sendMessage()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value;
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            const response = await fetch('http://127.0.0.1:8000/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const data = await response.json();
            addMessage(data.reply, 'bot');
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = sender === 'user' 
                ? 'bg-blue-100 p-2 rounded self-end max-w-[80%]' 
                : 'bg-gray-200 p-2 rounded self-start max-w-[80%]';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
