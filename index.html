<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Financial Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div
        class="max-w-5xl w-full glass rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row h-[85vh] md:h-[800px]">

        <!-- Sidebar / Actions Panel -->
        <div class="md:w-1/3 bg-white/50 border-r border-gray-100 p-6 flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div
                        class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">
                        💰</div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">Finance AI</h1>
                        <p class="text-xs text-gray-500">Personal Assistant</p>
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Smart Alerts</h3>

                    <button onclick="triggerAlert('overspending')"
                        class="w-full group hover:bg-white p-4 rounded-xl transition-all duration-200 border border-transparent hover:border-red-100 hover:shadow-sm text-left">
                        <div class="flex items-start gap-3">
                            <div
                                class="p-2 bg-red-100 text-red-600 rounded-lg group-hover:scale-110 transition-transform">
                                ⚠️</div>
                            <div>
                                <h4 class="font-semibold text-gray-800 text-sm">Overspending</h4>
                                <p class="text-xs text-gray-500 mt-1">Simulate budget breach</p>
                            </div>
                        </div>
                    </button>

                    <button onclick="triggerAlert('bill')"
                        class="w-full group hover:bg-white p-4 rounded-xl transition-all duration-200 border border-transparent hover:border-blue-100 hover:shadow-sm text-left">
                        <div class="flex items-start gap-3">
                            <div
                                class="p-2 bg-blue-100 text-blue-600 rounded-lg group-hover:scale-110 transition-transform">
                                📅</div>
                            <div>
                                <h4 class="font-semibold text-gray-800 text-sm">Bill Reminder</h4>
                                <p class="text-xs text-gray-500 mt-1">Upcoming payments</p>
                            </div>
                        </div>
                    </button>

                    <button onclick="triggerAlert('summary')"
                        class="w-full group hover:bg-white p-4 rounded-xl transition-all duration-200 border border-transparent hover:border-green-100 hover:shadow-sm text-left">
                        <div class="flex items-start gap-3">
                            <div
                                class="p-2 bg-green-100 text-green-600 rounded-lg group-hover:scale-110 transition-transform">
                                📊</div>
                            <div>
                                <h4 class="font-semibold text-gray-800 text-sm">Monthly Report</h4>
                                <p class="text-xs text-gray-500 mt-1">Financial health summary</p>
                            </div>
                        </div>
                    </button>
                </div>
            </div>

            <div class="mt-6">
                <button onclick="requestPermission()"
                    class="w-full py-2 text-xs text-indigo-500 font-medium hover:text-indigo-600 transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                        </path>
                    </svg>
                    Enable Notifications
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col bg-white">
            <!-- Chat Header -->
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-sm font-medium text-gray-600">Gemini Assistant Active</span>
                </div>
            </div>

            <!-- Messages -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6 scrollbar-hide">
                <div class="flex gap-4">
                    <div
                        class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center flex-shrink-0 text-indigo-600 text-xs font-bold">
                        AI</div>
                    <div class="bg-gray-50 p-4 rounded-2xl rounded-tl-none max-w-[85%]">
                        <p class="text-sm text-gray-700 leading-relaxed">Hello! I'm your AI Financial Assistant. I have
                            access to your income, savings, and goals. How can I help you today?</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-6 border-t border-gray-100">
                <div class="flex gap-2 relative">
                    <input type="text" id="user-input"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-gray-400"
                        placeholder="Ask about your budget, savings, or debt..."
                        onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()"
                        class="absolute right-2 top-2 bottom-2 bg-indigo-600 text-white px-4 rounded-lg hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 12h14M12 5l7 7-7 7"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            // Loading indicator
            const loadingId = addLoading();

            try {
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                removeLoading(loadingId);
                addMessage(data.reply, 'bot');
            } catch (e) {
                removeLoading(loadingId);
                addMessage("Sorry, I couldn't connect to the server.", 'bot');
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');

            if (sender === 'user') {
                div.className = 'flex gap-4 flex-row-reverse';
                div.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center flex-shrink-0 text-white text-xs font-bold shadow-md">You</div>
                    <div class="bg-indigo-600 p-4 rounded-2xl rounded-tr-none max-w-[85%] text-white shadow-sm">
                        <p class="text-sm leading-relaxed">${text}</p>
                    </div>
                `;
            } else {
                div.className = 'flex gap-4';
                div.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center flex-shrink-0 text-indigo-600 text-xs font-bold">AI</div>
                    <div class="bg-gray-50 p-4 rounded-2xl rounded-tl-none max-w-[85%]">
                        <p class="text-sm text-gray-700 leading-relaxed">${text}</p>
                    </div>
                `;
            }

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function addLoading() {
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex gap-4';
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center flex-shrink-0 text-indigo-600 text-xs font-bold">AI</div>
                <div class="bg-gray-50 p-4 rounded-2xl rounded-tl-none">
                    <div class="flex gap-1">
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce delay-100"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce delay-200"></div>
                    </div>
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function requestPermission() {
            if (!("Notification" in window)) alert("Not supported");
            else Notification.requestPermission();
        }

        async function triggerAlert(type) {
            if (Notification.permission !== "granted") {
                alert("Please enable permissions first by clicking 'Enable Notifications'.");
                return;
            }

            // Visual feedback on button
            addMessage(`Generate ${type} alert...`, 'user');
            const loadingId = addLoading();

            try {
                const response = await fetch('http://127.0.0.1:8000/generate-alert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: type })
                });
                const data = await response.json();

                removeLoading(loadingId);

                // Browser Notification
                new Notification("Financial Alert", {
                    body: data.message,
                    icon: "https://cdn-icons-png.flaticon.com/512/2953/2953363.png"
                });

                // Chat Log
                const div = document.createElement('div');
                div.className = 'flex justify-center my-4';
                div.innerHTML = `
                    <div class="bg-yellow-50 border border-yellow-200 text-yellow-800 px-4 py-2 rounded-lg text-sm flex items-center gap-2 shadow-sm">
                        <span>🔔</span>
                        <span class="font-medium">Alert Sent:</span>
                        <span>${data.message}</span>
                    </div>
                `;
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (e) {
                removeLoading(loadingId);
                console.error(e);
                addMessage("Failed to generate alert.", 'bot');
            }
        }
    </script>
</body>

</html>
